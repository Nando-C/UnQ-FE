<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.50 -17.50 143.26 79.26" role="img" aria-labelledby="ttl">
  <title id="ttl">UnQ</title>
  <desc>"Un" drawn as one continuous stroke that reads as a switchback queue, resolving into a table with one diner at it. Every curve is radius 15; every straight is 18. Two-tone: the queue is grey, the table and tail carry the gradient, the diner is solid coral.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5F45"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
    <path d="M 12,12 V 30 A 15,15 0 0,0 42,30 V 12 A 15,15 0 0,1 72,12 V 30" stroke="#B4A99E"/>
    <path d="M 94,12 A 15,15 0 0,1 124,12 L 124,30 A 15,15 0 0,1 94,30 Z" stroke="url(#g)"/>
    <path d="M 114.66,35.66 L 124.56,45.56" stroke="url(#g)"/>
  </g>
  <circle cx="124.56" cy="45.56" r="8.2" fill="#FF5F45"/>
</svg>
