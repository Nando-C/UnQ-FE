name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # msw answers every request, so the suite needs no API and no secrets.
      - run: npm test
      # Type-checks first (tsc --noEmit && vite build).
      - run: npm run build
