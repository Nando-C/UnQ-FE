name: Feature request
description: Something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What it would do
      description: Who it is for, a diner or a venue, and what changes for them on screen.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: On the API
      description: Whether the routes the API serves today are enough, or what it would need to add. The contract is owned by UnQ-BE.
  - type: textarea
    id: docs
    attributes:
      label: Docs to update
      description: The page in `docs/` or the README section that would describe it, and the screenshot that would show it.
