<svg xmlns="http://www.w3.org/2000/svg" viewBox="-51.00 -51.00 112.20 112.20" width="256" height="256" role="img" aria-labelledby="unqTitle unqDesc">
  <title id="unqTitle">UnQ</title>
  <desc id="unqDesc">A ring of dots forming a queue with one place left empty; the dots that broke away trail outward to form the tail of a Q.</desc>
  <defs>
    <!-- The gradient runs along the same diagonal the dots escape on, so the
         colour travels with them as they leave the queue. -->
    <linearGradient id="unqWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5F45"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
  </defs>
  <g fill="url(#unqWarm)">
    <!-- The queue: eight evenly spaced places, one of them vacated. -->
    <circle cx="0.00" cy="-36.00" r="7.00"/>
    <circle cx="25.46" cy="-25.46" r="7.00"/>
    <circle cx="36.00" cy="0.00" r="7.00"/>
    <circle cx="0.00" cy="36.00" r="7.00"/>
    <circle cx="-25.46" cy="25.46" r="7.00"/>
    <circle cx="-36.00" cy="0.00" r="7.00"/>
    <circle cx="-25.46" cy="-25.46" r="7.00"/>
    <!-- Whoever left it, walking away — and the Q's tail. -->
    <circle cx="34.65" cy="34.65" r="6.40" opacity="1.0"/>
    <circle cx="43.13" cy="43.13" r="4.60" opacity="0.7"/>
    <circle cx="50.20" cy="50.20" r="3.00" opacity="0.4"/>
  </g>
</svg>
